name: build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, toolchain: stable}
          - {os: ubuntu-latest, toolchain: "1.63", msrv: true}
          - {os: windows-latest, toolchain: stable-msvc}
          - {os: windows-latest, toolchain: stable-gnu}
          - {os: windows-11-arm, toolchain: stable-msvc}
          - {os: macos-latest, toolchain: stable}  # aarch64
          - {os: macos-13, toolchain: stable}      # x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      # Only used to generate the lockfile below, which needs cargo >= 1.84
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.msrv
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      # Resolve dependencies to the newest versions compatible with the
      # `rust-version` in Cargo.toml, rather than the newest versions overall
      - name: Generate an MSRV-compatible lockfile
        if: matrix.msrv
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo +stable generate-lockfile
      - uses: Swatinem/rust-cache@v2
      # `--locked` on MSRV builds so a failure to respect the lockfile above is loud
      - run: cargo build ${{ matrix.msrv && '--locked' || '' }} && cargo test ${{ matrix.msrv && '--locked' || '' }}

      # bindgen needs libclang, and a toolchain newer than the MSRV, so the
      # checks below are skipped on the MSRV job.
      # NOTE: the chocolatey fallback only provides an x86_64 libclang, which an
      # aarch64 bindgen cannot load. It is a no-op when the runner image already
      # ships LLVM, which is the case for windows-latest.
      - name: Locate libclang
        if: ${{ !matrix.msrv && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path (Join-Path $llvm 'libclang.dll'))) {
            choco install llvm --no-progress -y
          }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
      # bindgen writes to bindings.rs in the manifest directory, so regenerating
      # it must be a no-op. This also exercises the `snappy_status` assertion in
      # build.rs, which differs between the MSVC and Itanium C++ ABIs.
      - name: Check that bindings.rs is up to date
        if: ${{ !matrix.msrv }}
        run: cargo build --features bindgen && git diff --exit-code -- bindings.rs
